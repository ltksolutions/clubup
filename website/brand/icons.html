<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>ClubUp — Icon set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,700&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --navy:#1A2D47; --blue:#388FC3; --pale:#E8F4FD; --bg:#F4F6F8; --gray:#8E8E92; --line:#E2E5EA; --ink:#0E1320; }
body { background: var(--bg); font-family: 'Poppins', system-ui, sans-serif; color: var(--ink); }
.page { max-width:1200px; margin:0 auto; padding:64px 48px 120px; }
.crumb { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--gray); margin-bottom:14px; }
h1 { font-family:'Poppins',sans-serif; font-size:32px; font-weight:700; letter-spacing:-0.02em; color:var(--navy); margin-bottom:8px; }
.sub { font-size:14px; color:var(--gray); margin-bottom:36px; max-width:640px; line-height:1.55; }
.toolbar { display:flex; align-items:center; gap:10px; margin-bottom:36px; padding:14px 18px; background:#fff; border:1px solid var(--line); border-radius:14px; }
.size-btn { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:transparent; cursor:pointer; color:var(--gray); transition:all .12s; }
.size-btn.active { background:var(--navy); color:#fff; border-color:var(--navy); }
.dark-toggle { margin-left:auto; font-family:'Poppins',sans-serif; font-size:12px; font-weight:600; padding:7px 16px; border-radius:999px; border:1px solid var(--line); background:transparent; cursor:pointer; color:var(--ink); }
.section-title { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gray); margin:48px 0 16px; }
.section-title:first-of-type { margin-top:0; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:12px; }
.icon-cell { background:#fff; border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px 8px 14px; gap:10px; cursor:pointer; transition:all .12s; }
.icon-cell:hover { border-color:var(--blue); box-shadow:0 4px 14px rgba(56,143,195,0.12); }
.icon-cell span { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.04em; text-align:center; color:var(--gray); }
.toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff; padding:10px 22px; border-radius:999px; font-size:13px; font-weight:500; opacity:0; transition:all .25s; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
body.dark { background:#0E1320; color:#fff; }
body.dark .icon-cell { background:#1a2030; border-color:rgba(255,255,255,0.08); }
body.dark .icon-cell:hover { border-color:var(--blue); }
body.dark h1 { color:#fff; }
body.dark .toolbar { background:#1a2030; border-color:rgba(255,255,255,0.08); }
body.dark .size-btn { border-color:rgba(255,255,255,0.15); color:rgba(255,255,255,0.6); }
body.dark .size-btn.active { background:#fff; color:var(--navy); border-color:#fff; }
body.dark .dark-toggle { border-color:rgba(255,255,255,0.15); color:#fff; }
body.dark .section-title, body.dark .icon-cell span, body.dark .sub { color:rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div class="page">
  <div class="crumb">ClubUp · Brand · Icons</div>
  <h1>Icon set</h1>
  <p class="sub">32 ikôn na 24×24 mriežke · stroke 1.8px · round caps · navy + blue akcent. Klik na ikonu skopíruje SVG do schránky.</p>

  <div class="toolbar">
    <button class="size-btn" onclick="setSize(16, this)">16</button>
    <button class="size-btn active" onclick="setSize(24, this)">24</button>
    <button class="size-btn" onclick="setSize(32, this)">32</button>
    <button class="size-btn" onclick="setSize(48, this)">48</button>
    <button class="dark-toggle" onclick="toggleDark()">Light / Dark</button>
  </div>

  <div class="section-title">Klub & tímy</div>
  <div class="grid" id="grid-club"></div>

  <div class="section-title">Vzdelávanie</div>
  <div class="grid" id="grid-edu"></div>

  <div class="section-title">Riadenie & šport</div>
  <div class="grid" id="grid-mgmt"></div>

  <div class="section-title">Navigácia & UI</div>
  <div class="grid" id="grid-nav"></div>
</div>

<div class="toast" id="toast">SVG skopírovaný do schránky</div>

    ['member',        `<circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 20 C4 16.1 7.6 13 12 13 C16.4 13 20 16.1 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>`],
    ['add-member',    `<circle cx="10" cy="8" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 20 C3 16.1 6.1 13 10 13 C11.5 13 12.9 13.4 14 14.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M18 14 L18 20 M15 17 L21 17" stroke="${BLUE}" stroke-width="1.8" stroke-linecap="round"/>`],
    ['role',          `<rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="12" cy="9" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M7 18 C7 15.2 9.2 13 12 13 C14.8 13 17 15.2 17 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>`],
    ['president',     `<circle cx="12" cy="8" r="4" stroke="${NAVY}" stroke-width="1.8" fill="none"/><path d="M5 20 C5 16.1 8.1 13 12 13 C15.9 13 19 16.1 19 20" stroke="${NAVY}" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M9 6 L12 3 L15 6" stroke="${BLUE}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`],
    ['handshake',     `<path d="M2 13 L6 9 L9 9 L11 11 L11 13 L9 15 L7 15" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M22 13 L18 9 L15 9 L13 11" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M11 13 L13 11 L15 13 L13 15 L11 13" stroke="${BLUE}" stroke-width="1.8" stroke-linejoin="round" fill="none"/>`],
    ['organization',  `<rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="${BLUE}" stroke-width="1.8" fill="none"/>`],
  ],
  edu: [
    ['course',        `<path d="M3 5 L11 3 L11 21 L3 19 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M21 5 L13 3 L13 21 L21 19 Z" stroke="${BLUE}" stroke-width="1.8" fill="none" stroke-linejoin="round"/>`],
    ['certificate',   `<rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M7 8 L17 8 M7 12 L13 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="18" r="3.5" stroke="${BLUE}" stroke-width="1.8" fill="none"/><path d="M10 22 L12 19.5 L14 22" stroke="${BLUE}" stroke-width="1.8" stroke-linejoin="round" fill="none"/>`],
    ['lesson',        `<rect x="3" y="5" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M10 9.5 L15 12 L10 14.5 Z" fill="${BLUE}"/><path d="M8 21 L16 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`],
    ['video',         `<rect x="2" y="6" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 10 L22 7 L22 17 L16 14 Z" stroke="${BLUE}" stroke-width="1.8" stroke-linejoin="round" fill="none"/>`],
    ['library',       `<rect x="3" y="3" width="3" height="18" rx="1" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="8" y="3" width="3" height="18" rx="1" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M14 5 L17 4 L20 14 L17 15 Z" stroke="${BLUE}" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M14 5 L14 21 M20 14 L20 21" stroke="${BLUE}" stroke-width="1.8"/>`],
    ['mentor',        `<circle cx="12" cy="6" r="4" stroke="${NAVY}" stroke-width="1.8" fill="none"/><path d="M4 19 C4 15.7 7.6 13 12 13" stroke="${NAVY}" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M14 18 L16 20 L21 15" stroke="${BLUE}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`],
    ['progress',      `<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-opacity="0.25"/><path d="M12 3 A9 9 0 0 1 21 12" stroke="${BLUE}" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M9 12 L11 14 L15 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`],
    ['quiz',          `<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M9.5 9.5 C9.5 7.6 10.7 7 12 7 C13.3 7 14.5 7.6 14.5 9.5 C14.5 11 12 11.5 12 13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="12" cy="17" r="1.2" fill="${BLUE}"/>`],
  ],
  mgmt: [
    ['dashboard',     `<rect x="3" y="3" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="13" y="3" width="8" height="6" rx="1.5" stroke="${BLUE}" stroke-width="1.8" fill="none"/><rect x="13" y="11" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="3" y="15" width="8" height="6" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/>`],
    ['calendar',      `<rect x="3" y="4" width="18" height="17" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 10 L21 10" stroke="currentColor" stroke-width="1.8"/><path d="M8 2 L8 6 M16 2 L16 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="15" r="1.4" fill="currentColor"/><circle cx="12" cy="15" r="1.4" fill="${BLUE}"/><circle cx="16" cy="15" r="1.4" fill="currentColor"/>`],
    ['finance',       `<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M14 8 C12 7.5 10 8 10 9.5 C10 11 14 11 14 12.5 C14 14 12 14.5 10 14" stroke="${BLUE}" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M12 6 L12 8 M12 14 L12 16" stroke="${BLUE}" stroke-width="1.8" stroke-linecap="round"/>`],
    ['document',      `<path d="M5 3 L14 3 L19 8 L19 21 L5 21 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M14 3 L14 8 L19 8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M8 13 L16 13 M8 17 L13 17" stroke="${BLUE}" stroke-width="1.6" stroke-linecap="round"/>`],
    ['chart',         `<path d="M3 21 L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="5" y="13" width="3.5" height="6" rx="1" fill="currentColor" fill-opacity="0.3"/><rect x="10.25" y="9" width="3.5" height="10" rx="1" fill="${BLUE}"/><rect x="15.5" y="5" width="3.5" height="14" rx="1" fill="${NAVY}"/>`],
    ['tasks',         `<path d="M4 7 L6 9 L10 5" stroke="${BLUE}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M4 14 L6 16 L10 12" stroke="${BLUE}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M14 7 L20 7 M14 14 L20 14 M4 21 L20 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`],
    ['trophy',        `<path d="M7 3 L17 3 L17 10 C17 13.3 14.8 16 12 16 C9.2 16 7 13.3 7 10 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M17 6 L20 6 C20 9 18 11 17 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M7 6 L4 6 C4 9 6 11 7 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M12 16 L12 20 M8 20 L16 20" stroke="${BLUE}" stroke-width="1.8" stroke-linecap="round"/>`],
    ['stadium',       `<path d="M2 14 C2 10.7 6.5 8 12 8 C17.5 8 22 10.7 22 14 C22 17.3 17.5 20 12 20 C6.5 20 2 17.3 2 14 Z" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M5 14 L19 14" stroke="${BLUE}" stroke-width="1.4" stroke-opacity="0.6"/><circle cx="12" cy="14" r="2.5" stroke="${BLUE}" stroke-width="1.6" fill="none"/><path d="M9 4 L15 4 L14 8 L10 8 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>`],
  ],
  nav: [
    ['home',          `<path d="M3 11 L12 3 L21 11 L21 21 L15 21 L15 15 L9 15 L9 21 L3 21 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>`],
    ['search',        `<circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16 L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`],
    ['settings',      `<circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 2 L12 4 M12 20 L12 22 M2 12 L4 12 M20 12 L22 12 M4.9 4.9 L6.3 6.3 M17.7 17.7 L19.1 19.1 M19.1 4.9 L17.7 6.3 M6.3 17.7 L4.9 19.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`],
    ['notification',  `<path d="M12 3 C8.7 3 6 5.7 6 9 L6 15 L4 17 L20 17 L18 15 L18 9 C18 5.7 15.3 3 12 3 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M10 17 Q10 20 12 20 Q14 20 14 17" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="18" cy="5" r="3" fill="${BLUE}"/>`],
    ['close',         `<path d="M5 5 L19 19 M19 5 L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`],
    ['check',         `<path d="M4 12 L9 17 L20 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`],
    ['arrow-right',   `<path d="M5 12 L19 12 M13 6 L19 12 L13 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`],
    ['back',          `<path d="M19 12 L5 12 M11 6 L5 12 L11 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`],
    ['menu',          `<path d="M3 6 L21 6 M3 12 L21 12 M3 18 L21 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`],
    ['plus',          `<path d="M12 4 L12 20 M4 12 L20 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`],
    ['filter',        `<path d="M3 5 L21 5 L14 13 L14 20 L10 18 L10 13 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>`],
    ['lock',          `<rect x="5" y="11" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 11 L8 7 C8 4.8 10 3 12 3 C14 3 16 4.8 16 7 L16 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="12" cy="16" r="1.5" fill="currentColor"/>`],
    ['info',          `<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 11 L12 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor"/>`],
    ['edit',          `<path d="M14 4 L20 10 L8 22 L2 22 L2 16 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M17 7 L11 13" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.5"/>`],
    ['delete',        `<path d="M3 7 L21 7 M8 7 L8 4 L16 4 L16 7 M10 11 L10 18 M14 11 L14 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 7 L6 20 L18 20 L19 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`],
    ['external',      `<path d="M14 4 L20 4 L20 10 M20 4 L11 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M17 14 L17 19 C17 20.1 16.1 21 15 21 L5 21 C3.9 21 3 20.1 3 19 L3 9 C3 7.9 3.9 7 5 7 L10 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>`],
  ],
};

function renderIcon(svgContent, size) {
  const colour = darkMode ? '#fafaf7' : '#0E1320';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:${colour}">${svgContent}</svg>`;
}
function buildGrid(id, items) {
  document.getElementById(id).innerHTML = items.map(([n, s]) => `
    <div class="icon-cell" data-name="${n}" onclick='copySVG(${JSON.stringify(n)}, ${JSON.stringify(s)})'>${renderIcon(s, currentSize)}<span>${n}</span></div>
  `).join('');
}
function renderAll() {
  buildGrid('grid-club', icons.club);
  buildGrid('grid-edu', icons.edu);
  buildGrid('grid-mgmt', icons.mgmt);
  buildGrid('grid-nav', icons.nav);
}
function setSize(s, btn) {
  currentSize = s;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}
function toggleDark() {
  darkMode = !darkMode;
  document.body.classList.toggle('dark', darkMode);
  renderAll();
}
function copySVG(name, paths) {
  const svg = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">\n${paths}\n</svg>`;
  navigator.clipboard.writeText(svg).then(() => {
    const t = document.getElementById('toast');
    t.textContent = `✓ ${name} skopírovaný`;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  });
}
renderAll();
</script>
</body>
</html>
